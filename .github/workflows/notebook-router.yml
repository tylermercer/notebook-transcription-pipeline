name: Notebook Router Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'notebook-pages/**/*.md'
      - '!notebook-pages/**/README.md'
      - '!notebook-pages/README.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-sync-dry-run:
    name: Dry Run on PR Sync
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Get changed notebook files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            notebook-pages/**/*.md
          files_ignore: |
            notebook-pages/**/README.md
            notebook-pages/README.md

      - name: Run Dry Run
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          EXISTING_FILES=""
          for f in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [ -f "$f" ] && [ "$(basename "$f")" != "README.md" ]; then
              EXISTING_FILES="$EXISTING_FILES $f"
            fi
          done

          if [ -n "$EXISTING_FILES" ]; then
            bun run runner.ts --dry-run $EXISTING_FILES | tee dry-run-output.txt
          else
            echo "No existing notebook transcript files to dry run." > dry-run-output.txt
          fi

      - name: Comment Dry Run Output on PR
        uses: actions/github-script@v7
        if: steps.changed-files.outputs.any_changed == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('dry-run-output.txt')) return;
            const output = fs.readFileSync('dry-run-output.txt', 'utf8');
            const header = '### 📓 Notebook Router Dry Run';
            const body = `${header}\n\n\`\`\`\n${output}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body && c.body.startsWith(header));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  pr-closed-run:
    name: Run on PR Close
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Get changed notebook files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            notebook-pages/**/*.md
          files_ignore: |
            notebook-pages/**/README.md
            notebook-pages/README.md

      - name: Execute Router (Dry Run for now)
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          EXISTING_FILES=""
          for f in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [ -f "$f" ] && [ "$(basename "$f")" != "README.md" ]; then
              EXISTING_FILES="$EXISTING_FILES $f"
            fi
          done

          if [ -n "$EXISTING_FILES" ]; then
            # Currently configured as a dry-run when PR is closed.
            # To enable live execution in the future, remove the --dry-run flag and set production secrets.
            bun run runner.ts --dry-run $EXISTING_FILES
          fi
