<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Capture & Transcription</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f7f7f8;
      color: #111;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { font-size: 1.4rem; margin-top: 0; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type="file"] {
      display: block;
      width: 100%;
      margin-bottom: 16px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .preview-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .preview-item {
      position: relative;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 1;
      background: #eee;
    }
    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    button {
      display: block;
      width: 100%;
      background-color: #0066cc;
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { background-color: #999; cursor: not-allowed; }
    .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 26px;
      height: 26px;
      padding: 0;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border-radius: 50%;
      font-size: 16px;
      font-weight: bold;
      line-height: 26px;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status { margin-top: 12px; color: #555; font-size: 0.9rem; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <!-- State 1: Capture -->
    <div id="state-capture">
      <h1>Notebook Page Capture</h1>
      <form id="transcribe-form">
        <label for="image-input">Photograph notebook page(s):</label>
        <input type="file" id="image-input" accept="image/*" capture="environment" multiple>
        <div id="preview-list" class="preview-list"></div>
        <button type="submit" id="transcribe-btn" disabled>Transcribe</button>
      </form>
      <div id="transcribe-status" class="status"></div>
    </div>

    <!-- State 2: Host Instructions / Completion -->
    <div id="state-complete" class="hidden">
      <h1>Continue on Host Machine</h1>
      <p style="margin-bottom: 20px; line-height: 1.5; color: #333;">
        The transcript has been generated and opened in the text editor on your host machine. Review and save the transcript on the host to finalize appending it to <code>notebook.md</code>.
      </p>
      <button type="button" id="reset-btn">Capture another page</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('t') || '';

    const stateCapture = document.getElementById('state-capture');
    const stateComplete = document.getElementById('state-complete');

    const transcribeForm = document.getElementById('transcribe-form');
    const imageInput = document.getElementById('image-input');
    const previewList = document.getElementById('preview-list');
    const transcribeBtn = document.getElementById('transcribe-btn');
    const transcribeStatus = document.getElementById('transcribe-status');

    const resetBtn = document.getElementById('reset-btn');

    let capturedFiles = [];
    const objectUrls = new Set();

    function clearObjectUrls() {
      objectUrls.forEach((url) => URL.revokeObjectURL(url));
      objectUrls.clear();
    }

    function renderPreviews() {
      clearObjectUrls();
      previewList.innerHTML = '';

      if (capturedFiles.length === 0) {
        transcribeBtn.disabled = true;
        transcribeBtn.textContent = 'Transcribe';
        return;
      }

      transcribeBtn.disabled = false;
      transcribeBtn.textContent = `Transcribe (${capturedFiles.length} photo${capturedFiles.length > 1 ? 's' : ''})`;

      capturedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'preview-item';

        const img = document.createElement('img');
        const url = URL.createObjectURL(file);
        objectUrls.add(url);
        img.src = url;
        img.alt = file.name || `Photo ${index + 1}`;

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'remove-btn';
        removeBtn.setAttribute('aria-label', `Remove photo ${index + 1}`);
        removeBtn.innerHTML = '&times;';
        removeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          removeFile(index);
        });

        item.appendChild(img);
        item.appendChild(removeBtn);
        previewList.appendChild(item);
      });
    }

    function removeFile(index) {
      capturedFiles.splice(index, 1);
      renderPreviews();
    }

    function resetCaptureForm() {
      capturedFiles = [];
      imageInput.value = '';
      clearObjectUrls();
      renderPreviews();
    }

    imageInput.addEventListener('change', () => {
      const newFiles = Array.from(imageInput.files || []);
      if (newFiles.length > 0) {
        capturedFiles = capturedFiles.concat(newFiles);
        imageInput.value = '';
        renderPreviews();
      }
    });

    function showState(state) {
      stateCapture.classList.add('hidden');
      stateComplete.classList.add('hidden');
      if (state === 'capture') stateCapture.classList.remove('hidden');
      if (state === 'complete') stateComplete.classList.remove('hidden');
    }

    transcribeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (capturedFiles.length === 0) return;

      transcribeBtn.disabled = true;
      transcribeStatus.textContent = 'Transcribing image(s) and opening host editor... Please wait.';

      try {
        const formData = new FormData();
        for (let i = 0; i < capturedFiles.length; i++) {
          formData.append('images', capturedFiles[i]);
        }

        const res = await fetch(`/?t=${encodeURIComponent(token)}`, {
          method: 'POST',
          headers: { 'X-Action': 'transcribe' },
          body: formData
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`Server error (${res.status}): ${errText}`);
        }

        transcribeStatus.textContent = '';
        resetCaptureForm();
        showState('complete');
      } catch (err) {
        transcribeStatus.textContent = `Error: ${err.message}`;
      } finally {
        transcribeBtn.disabled = capturedFiles.length === 0;
      }
    });

    resetBtn.addEventListener('click', () => {
      resetCaptureForm();
      showState('capture');
    });

    // Initial render state
    renderPreviews();
  </script>
</body>
</html>
